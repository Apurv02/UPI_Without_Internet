name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-h2:
    name: Tests (H2, default profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: chmod +x mvnw && ./mvnw -B verify

  test-postgres:
    name: Tests (PostgreSQL + Flyway, prod profile)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: upimesh
          POSTGRES_USER: upi
          POSTGRES_PASSWORD: upi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U upi -d upimesh"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://localhost:5432/upimesh
      DB_USER: upi
      DB_PASS: upi
      UPI_REQUIRE_PERSISTENT_KEY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: chmod +x mvnw && ./mvnw -B verify

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t upi-offline-mesh .
