# PRODUCTION profile (PostgreSQL). Activate with SPRING_PROFILES_ACTIVE=prod
server.port=${PORT:8080}

# --- PostgreSQL (all values come from environment variables) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=30000

# --- Schema is owned by Flyway; Hibernate only VALIDATES it ---
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Security hardening ---
spring.h2.console.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.shutdown=graceful

# --- RSA key must be provided (set to false only for CI) ---
upi.mesh.rsa.private-key=${UPI_RSA_PRIVATE_KEY:}
upi.mesh.rsa.require-persistent-key=${UPI_REQUIRE_PERSISTENT_KEY:true}

logging.level.com.demo.upimesh=INFO
