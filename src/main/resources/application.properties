# Server
server.port=8080

# DEFAULT (dev/test) profile: H2 in-memory database, zero setup.
# For PostgreSQL use the 'prod' profile -> see application-prod.properties
spring.datasource.url=jdbc:h2:mem:upimesh
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Idempotency window (how long a packet hash is remembered)
upi.mesh.idempotency-ttl-seconds=86400

# Packet freshness window — anything older than this is rejected as replay
upi.mesh.packet-max-age-seconds=86400

# Flyway is only used with PostgreSQL (prod profile)
spring.flyway.enabled=false

# RSA key: empty = generate a fresh keypair at startup (dev only).
upi.mesh.rsa.private-key=${UPI_RSA_PRIVATE_KEY:}
upi.mesh.rsa.require-persistent-key=false
