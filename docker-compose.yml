# Local run with real PostgreSQL:  docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upimesh
      POSTGRES_USER: upi
      POSTGRES_PASSWORD: upi
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upi -d upimesh"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/upimesh
      DB_USER: upi
      DB_PASS: upi
      UPI_REQUIRE_PERSISTENT_KEY: "false"   # local only; set UPI_RSA_PRIVATE_KEY for a stable key
volumes:
  pgdata:
